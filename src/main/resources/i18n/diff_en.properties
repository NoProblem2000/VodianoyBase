# Texts of the diff engine: change details and warnings (MessageFormat, an apostrophe is written twice).
# .APPLIED: the change already happened in the live database (working tree, drift)
# .PLANNED: the change happens when the script runs (sync, snapshot, rollback, revert, discard)
# .RECORDED: what a commit did (history)
