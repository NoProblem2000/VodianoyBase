loss.warning.APPLIED={0} was already dropped in the live database. Its data{1} is permanently lost! Note: Discard (reset to HEAD) runs CREATE / ALTER and restores only an empty structure without rows.
loss.warning.PLANNED=Running this script drops {0} together with all its data{1}.
loss.warning.RECORDED={0} was dropped together with its data{1}.
