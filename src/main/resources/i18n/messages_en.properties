# PgGitVisualizer server messages (English). UTF-8.
# Patterns with arguments use java.text.MessageFormat: a single quote is written as two ('').
# Messages without arguments are returned as they are: do not double quotes there.

error.db.connection=Cannot connect to the database: {0}
error.request.invalid=Invalid request: {0}

env.idRequired=environmentId is required
env.required=Environment is required
env.nameRequired=Environment name is required
env.jdbcUrlInvalid=JDBC URL must start with jdbc:postgresql:
env.colorInvalid=colorBadge must look like #22c55e
env.notFound=Environment not found: {0}
env.unreachable=Cannot connect to ''{0}'': {1}

schema.unknown=Unknown or not version-controllable schema(s): {0}. Available: {1}

pgvc.pgVersion=PostgreSQL 11 or newer is required
pgvc.notSuperuser=The user of environment ''{0}'' is not a SUPERUSER: event triggers can only be created by a superuser
pgvc.notInitialized=Version control is not initialized in environment ''{0}''. Initialize it first (POST /api/environments/{0}/pgvc/initialize).

commit.notFound=Commit {0} not found in environment ''{1}''
commit.messageRequired=Commit message is required
commit.headMoved=HEAD of ''{0}'' has moved to {1} since the working tree was read. Refresh and review the changes again.
commit.nothing=Nothing to commit: the database schema matches HEAD

migration.upSqlEmpty=UP SQL is empty
migration.transactionControl=UP SQL must not contain BEGIN / COMMIT / ROLLBACK: the migration runs inside one transaction managed by PgGitVisualizer
migration.dirty=The database has {0} uncommitted schema change(s) ({1}). Commit them first or allow including them.

rollback.targetRequired=targetHash is required
rollback.transactionControl=Rollback SQL must not contain BEGIN / COMMIT / ROLLBACK
rollback.noCommits=Environment ''{0}'' has no commits to roll back
rollback.dirty=The database has uncommitted schema changes ({0}). Commit or revert them before rolling back.
rollback.verifyFailed=After the rollback SQL the schema still differs from commit {0}: {1}. Nothing was changed. Adjust the rollback SQL.
rollback.alreadyAt=The environment is already at commit {0}
rollback.notAncestor=Commit {0} is not an ancestor of HEAD {1}: only earlier commits of the current history can be restored

history.targetRequired=Target commit is required
history.cycle=Cycle in the commit history at {0}
history.notAncestor=Commit {0} is not an ancestor of {1} in environment ''{2}''

sync.envsRequired=Source and target environments are required
sync.envsSame=Source and target environments must be different
sync.alreadyAt=Environment ''{0}'' is already at {1}

push.noCommits=Environment ''{0}'' has no commits to push
push.notAncestor=Cannot push: HEAD {0} of ''{1}'' is not an ancestor of {2} in ''{3}'' (the target is ahead or the histories diverged)
push.untrackedTarget=''{0}'' has no version history but already contains tables, views or sequences. Link it to the history of the source (Sync / Push to Env, Link) or allow pushing on top of them.
push.dirty=''{0}'' has uncommitted schema changes ({1}). Commit them there first, or allow pushing anyway.
push.commitFailed=Commit {0} ({1}) failed on ''{2}'': {3}. Nothing was applied.
push.verifyFailed=After applying the commits the schema of ''{0}'' differs from commit {1}: {2}. Nothing was applied.

link.noCommits=Environment ''{0}'' has no commits to link to
link.notInHistory=Commit {0} is not in the current history of ''{1}'' (HEAD {2})
link.noMatch=The schema of ''{0}'' does not match any commit of ''{1}''. Choose the commit explicitly to see the differences.
link.schemaDiffers=The schema of ''{0}'' differs from commit {1} ({2}). To match the commit it would need: {3}. Nothing was changed. Bring the schemas in line, link to another commit or accept the differences.

export.noCommits=Environment ''{0}'' has no commits to export
export.empty=The bundle would be empty: from and to are the same commit

delete.notFound=Commit {0} was not found in any reachable environment
delete.reachable=Commit {0} cannot be deleted: it is part of the current history of {1}. Roll the environment(s) back to an earlier commit first.
delete.offline=Cannot delete commits while {0} cannot be reached: it is unknown whether the commits are used there.
delete.changed=The history of ''{0}'' changed during the deletion and now uses these commits. Nothing more was deleted.

snapshot.missingSchema=The file is not a PgGitVisualizer snapshot: schemaSnapshot is missing
snapshot.unsupportedFormat=Unsupported snapshot format version {0} (supported: {1})

# ---- migration execution (Step 10)
migration.badTimeout=Invalid {0}: {1} (use e.g. 3s, 500ms, 2min; 0 = no limit)
migration.lockTimeout=Could not get a lock within lock_timeout = {0}: another session holds it. Nothing of this step was applied; retry later or raise lock_timeout. ({1})
migration.statementTimeout=A statement ran longer than statement_timeout = {0} and was cancelled. Nothing of this step was applied; raise statement_timeout or split the work. ({1})
migration.stepFailed=Step {0} of {1} failed: {2}. Steps 1-{3} are already applied and show up as uncommitted changes (Working Tree): commit or revert them.
migration.stepFailedFirst=Step 1 of {0} failed: {1}. Nothing was applied.
migration.headMovedAfterSteps=HEAD of ''{0}'' moved to {1} while the steps were running. The changes are applied and show up as uncommitted changes (Working Tree).

# ---- safety analyzer (Step 10); texts without arguments must not double quotes
safety.duration.instant=instant: catalog change only
safety.duration.scan=≈ {0}: table scan of {1} / {2} rows
safety.duration.rewrite=≈ {0}: table rewrite of {1} / {2} rows
safety.duration.index=≈ {0}: index build over {1} / {2} rows
safety.duration.update=≈ {0}: row-by-row update of {1} / {2} rows
safety.time.underSecond=< 1 s
safety.time.seconds={0} s
safety.time.minutes={0} min
safety.time.hours={0} h
safety.note.notAnalysed=Statement not analysed in detail.
safety.note.partitionOf=Takes ACCESS EXCLUSIVE on the parent {0} for a moment; with a DEFAULT partition its rows are scanned under that lock.
safety.note.createTableAs=Runs the query and copies its rows.
safety.note.dropTable=The table and all its rows are deleted.
safety.note.truncate=All rows are deleted.
safety.note.concurrently=Built without blocking writes; runs outside of a transaction as a step of its own.
safety.note.createIndex=CREATE INDEX blocks INSERT / UPDATE / DELETE on the table until the index is built.
safety.note.partitionedIndex=CREATE INDEX CONCURRENTLY is not supported on partitioned tables: create the index CONCURRENTLY on every partition, then ON ONLY the parent and ATTACH them.
safety.note.refreshConcurrently=Readers are not blocked (needs a unique index).
safety.note.refresh=Blocks reads of the materialized view until it is refreshed: consider REFRESH ... CONCURRENTLY.
safety.note.view=Views have no data: the change is instant.
safety.note.dropSchemaCascade=CASCADE drops every object of the schema with its data.
safety.note.update=Updates rows in place: row locks, table bloat; split big updates into batches.
safety.note.updateAll=UPDATE without WHERE rewrites every row: row locks and table bloat; split it into batches.
safety.note.delete=Deletes rows.
safety.note.deleteAll=DELETE without WHERE deletes every row.
safety.note.vacuumFull=Rewrites the whole table under ACCESS EXCLUSIVE: reads and writes are blocked.
safety.note.reindex=Blocks writes (and reads using the index) while rebuilding: consider REINDEX ... CONCURRENTLY.
safety.note.fkReferenced=Also locks the referenced table {0} (SHARE ROW EXCLUSIVE).
safety.note.fkScan=Checks every existing row while blocking writes to both tables: use NOT VALID + VALIDATE CONSTRAINT.
safety.note.checkScan=Checks every existing row under ACCESS EXCLUSIVE: use NOT VALID + VALIDATE CONSTRAINT.
safety.note.uniqueIndex=Builds the unique index under ACCESS EXCLUSIVE: build it CONCURRENTLY first, then ADD CONSTRAINT ... USING INDEX.
safety.note.dropColumn=Column {0} and its values are dropped.
safety.note.typeNoRewrite=Type change of {0} is binary compatible: no table rewrite.
safety.note.typeRewrite=Changing {0} from {1} to {2} rewrites the table and its indexes under ACCESS EXCLUSIVE.
safety.note.typeNarrowing=The new type of {0} is narrower: values may be cut or the statement may fail.
safety.note.setNotNull=SET NOT NULL scans the whole table under ACCESS EXCLUSIVE.
safety.note.validate=Scans the table without blocking reads or writes (SHARE UPDATE EXCLUSIVE).
safety.note.rename=Renaming breaks queries of applications that still use the old name.
safety.note.attach=Scans partition {0} to check its bound (add a matching CHECK constraint first to skip the scan).
safety.note.detachConcurrently=PostgreSQL 14+: DETACH PARTITION ... CONCURRENTLY does not block queries on the parent.
safety.note.addColumnRewrite=Adding {0} with a volatile default, identity or generated value rewrites the whole table.
safety.note.addColumnDefaultOld=Before PostgreSQL 11 a column with DEFAULT rewrites the table ({0}).
safety.note.addNotNullFails=NOT NULL column {0} without DEFAULT fails on a table with rows.
safety.note.briefLockBigTable=Brief ACCESS EXCLUSIVE on a big table: queued behind long queries it blocks everything; lock_timeout limits the wait.
safety.note.blocksAll=Reads and writes of the table are blocked for the whole duration.
safety.note.blocksWrites=Writes to the table are blocked for the whole duration.
safety.alt.backfill=fill the new column for existing rows before VALIDATE (in batches for big tables), e.g.:
safety.alt.setNotNullUsesCheck=PostgreSQL 12+: SET NOT NULL uses the validated CHECK and skips the table scan
push.stepFailed=Commit {0} ({1}): step {2} of {3} failed on ''{4}'': {5}. The commits before it are pushed; the applied steps of this commit show up there as uncommitted changes.

