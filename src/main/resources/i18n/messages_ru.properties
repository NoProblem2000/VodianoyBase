# Сообщения сервера PgGitVisualizer (русский). UTF-8.
# Шаблоны с аргументами — java.text.MessageFormat: одинарная кавычка пишется двумя (''), поэтому имена берём в «».

error.db.connection=Не удалось подключиться к базе данных: {0}
error.request.invalid=Некорректный запрос: {0}

env.idRequired=Не указан environmentId
env.required=Не переданы параметры окружения
env.nameRequired=Укажите имя окружения
env.jdbcUrlInvalid=JDBC URL должен начинаться с jdbc:postgresql:
env.colorInvalid=Цвет бейджа должен быть в формате #22c55e
env.notFound=Окружение не найдено: {0}
env.unreachable=Не удалось подключиться к «{0}»: {1}

schema.unknown=Неизвестные или неотслеживаемые схемы: {0}. Доступны: {1}

pgvc.pgVersion=Нужен PostgreSQL 11 или новее
pgvc.notSuperuser=Пользователь окружения «{0}» не является SUPERUSER: event triggers может создать только суперпользователь
pgvc.notInitialized=Контроль версий в окружении «{0}» не подключён. Сначала выполните инициализацию (POST /api/environments/{0}/pgvc/initialize).

commit.notFound=Коммит {0} не найден в окружении «{1}»
commit.messageRequired=Укажите сообщение коммита
commit.headMoved=HEAD окружения «{0}» сдвинулся на {1}, пока вы просматривали изменения. Обновите страницу и проверьте изменения ещё раз.
commit.nothing=Нечего коммитить: схема базы совпадает с HEAD

migration.upSqlEmpty=UP SQL пуст
migration.transactionControl=UP SQL не должен содержать BEGIN / COMMIT / ROLLBACK: миграция выполняется в одной транзакции, которой управляет PgGitVisualizer
migration.dirty=В базе {0} незакоммиченных изменений схемы ({1}). Сначала закоммитьте их или разрешите включить их в миграцию.

rollback.targetRequired=Не указан целевой коммит (targetHash)
rollback.transactionControl=SQL отката не должен содержать BEGIN / COMMIT / ROLLBACK
rollback.noCommits=В окружении «{0}» нет коммитов для отката
rollback.dirty=В базе есть незакоммиченные изменения схемы ({0}). Закоммитьте или отмените их перед откатом.
rollback.verifyFailed=После выполнения SQL отката схема всё ещё отличается от коммита {0}: {1}. Ничего не изменено. Исправьте SQL отката.
rollback.alreadyAt=Окружение уже находится на коммите {0}
rollback.notAncestor=Коммит {0} не является предком HEAD {1}: восстановить можно только более ранние коммиты текущей истории

history.targetRequired=Не указан целевой коммит
history.cycle=Цикл в истории коммитов на {0}
history.notAncestor=Коммит {0} не является предком {1} в окружении «{2}»

sync.envsRequired=Укажите исходное и целевое окружения
sync.envsSame=Исходное и целевое окружения должны различаться
sync.alreadyAt=Окружение «{0}» уже находится на {1}

push.noCommits=В окружении «{0}» нет коммитов для наката
push.notAncestor=Накат невозможен: HEAD {0} окружения «{1}» не является предком {2} в «{3}» (цель впереди или истории разошлись)
push.untrackedTarget=У «{0}» нет истории версий, но уже есть таблицы, представления или последовательности. Привяжите окружение к истории источника (Sync / Push to Env → Link) или разрешите накат поверх них.
push.dirty=В «{0}» есть незакоммиченные изменения схемы ({1}). Сначала закоммитьте их там или разрешите накат несмотря на них.
push.commitFailed=Коммит {0} ({1}) не выполнился в «{2}»: {3}. Ничего не применено.
push.verifyFailed=После наката схема «{0}» отличается от коммита {1}: {2}. Ничего не применено.

link.noCommits=В окружении «{0}» нет коммитов, к которым можно привязаться
link.notInHistory=Коммита {0} нет в текущей истории «{1}» (HEAD {2})
link.noMatch=Схема «{0}» не совпадает ни с одним коммитом «{1}». Выберите коммит явно, чтобы увидеть различия.
link.schemaDiffers=Схема «{0}» отличается от коммита {1} ({2}): {3}. Ничего не изменено. Выровняйте схемы или привяжите к другому коммиту.

export.noCommits=В окружении «{0}» нет коммитов для экспорта
export.empty=Бандл получился бы пустым: начальный и конечный коммиты совпадают

delete.notFound=Коммит {0} не найден ни в одном доступном окружении
delete.reachable=Коммит {0} нельзя удалить: он входит в текущую историю {1}. Сначала откатите окружение(я) к более раннему коммиту.
delete.offline=Нельзя удалять коммиты, пока недоступно: {0} — неизвестно, используются ли коммиты там.
delete.changed=История «{0}» изменилась во время удаления и теперь использует эти коммиты. Больше ничего не удалено.

snapshot.missingSchema=Файл не является слепком PgGitVisualizer: нет schemaSnapshot
snapshot.unsupportedFormat=Неподдерживаемая версия формата слепка {0} (поддерживается: {1})

# ---- выполнение миграций (Шаг 10)
migration.badTimeout=Некорректный {0}: {1} (например 3s, 500ms, 2min; 0 — без ограничения)
migration.lockTimeout=Не удалось получить блокировку за lock_timeout = {0}: её держит другой сеанс. Из этого шага ничего не применено; повторите позже или увеличьте lock_timeout. ({1})
migration.statementTimeout=Команда выполнялась дольше statement_timeout = {0} и была прервана. Из этого шага ничего не применено; увеличьте statement_timeout или разбейте работу. ({1})
migration.stepFailed=Шаг {0} из {1} не выполнился: {2}. Шаги 1–{3} уже применены и видны как незакоммиченные изменения (Working Tree): закоммитьте или отмените их.
migration.stepFailedFirst=Шаг 1 из {0} не выполнился: {1}. Ничего не применено.
migration.headMovedAfterSteps=HEAD окружения «{0}» сдвинулся на {1}, пока выполнялись шаги. Изменения применены и видны как незакоммиченные (Working Tree).

# ---- анализатор безопасности (Шаг 10)
safety.duration.instant=мгновенно: меняется только каталог
safety.duration.scan=≈ {0}: сканирование {1} / {2} строк
safety.duration.rewrite=≈ {0}: перезапись таблицы {1} / {2} строк
safety.duration.index=≈ {0}: построение индекса по {1} / {2} строк
safety.duration.update=≈ {0}: построчное обновление {1} / {2} строк
safety.time.underSecond=< 1 с
safety.time.seconds={0} с
safety.time.minutes={0} мин
safety.time.hours={0} ч
safety.note.notAnalysed=Команда подробно не анализировалась.
safety.note.partitionOf=На мгновение берёт ACCESS EXCLUSIVE на родителя {0}; при наличии DEFAULT-партиции её строки сканируются под этой блокировкой.
safety.note.createTableAs=Выполняет запрос и копирует его строки.
safety.note.dropTable=Таблица удаляется вместе со всеми строками.
safety.note.truncate=Удаляются все строки.
safety.note.concurrently=Строится без блокировки записи; выполняется вне транзакции отдельным шагом.
safety.note.createIndex=CREATE INDEX блокирует INSERT / UPDATE / DELETE в таблице, пока индекс строится.
safety.note.partitionedIndex=CREATE INDEX CONCURRENTLY не поддерживается для партиционированных таблиц: создайте индекс CONCURRENTLY на каждой партиции, затем ON ONLY на родителе и выполните ATTACH.
safety.note.refreshConcurrently=Чтение не блокируется (нужен уникальный индекс).
safety.note.refresh=Блокирует чтение материализованного представления до конца обновления: рассмотрите REFRESH ... CONCURRENTLY.
safety.note.view=У представлений нет данных: изменение мгновенное.
safety.note.dropSchemaCascade=CASCADE удаляет все объекты схемы вместе с данными.
safety.note.update=Обновляет строки на месте: блокировки строк и разрастание таблицы; большие обновления делайте пачками.
safety.note.updateAll=UPDATE без WHERE переписывает каждую строку: блокировки строк и разрастание таблицы; разбейте на пачки.
safety.note.delete=Удаляет строки.
safety.note.deleteAll=DELETE без WHERE удаляет все строки.
safety.note.vacuumFull=Переписывает всю таблицу под ACCESS EXCLUSIVE: чтение и запись заблокированы.
safety.note.reindex=Блокирует запись (и чтение через индекс) на время перестроения: рассмотрите REINDEX ... CONCURRENTLY.
safety.note.fkReferenced=Также блокирует связанную таблицу {0} (SHARE ROW EXCLUSIVE).
safety.note.fkScan=Проверяет каждую существующую строку, блокируя запись в обе таблицы: используйте NOT VALID + VALIDATE CONSTRAINT.
safety.note.checkScan=Проверяет каждую существующую строку под ACCESS EXCLUSIVE: используйте NOT VALID + VALIDATE CONSTRAINT.
safety.note.uniqueIndex=Строит уникальный индекс под ACCESS EXCLUSIVE: сначала постройте его CONCURRENTLY, затем ADD CONSTRAINT ... USING INDEX.
safety.note.dropColumn=Колонка {0} удаляется вместе со значениями.
safety.note.typeNoRewrite=Смена типа {0} двоично совместима: перезаписи таблицы нет.
safety.note.typeRewrite=Смена типа {0} с {1} на {2} перезаписывает таблицу и её индексы под ACCESS EXCLUSIVE.
safety.note.typeNarrowing=Новый тип {0} уже прежнего: значения могут обрезаться, или команда упадёт.
safety.note.setNotNull=SET NOT NULL сканирует всю таблицу под ACCESS EXCLUSIVE.
safety.note.validate=Сканирует таблицу, не блокируя чтение и запись (SHARE UPDATE EXCLUSIVE).
safety.note.rename=Переименование ломает запросы приложений, которые ещё используют старое имя.
safety.note.attach=Сканирует партицию {0} для проверки границ (добавьте заранее совпадающий CHECK, чтобы пропустить сканирование).
safety.note.detachConcurrently=PostgreSQL 14+: DETACH PARTITION ... CONCURRENTLY не блокирует запросы к родителю.
safety.note.addColumnRewrite=Добавление {0} с изменчивым DEFAULT, identity или вычисляемым значением перезаписывает всю таблицу.
safety.note.addColumnDefaultOld=До PostgreSQL 11 колонка с DEFAULT перезаписывает таблицу ({0}).
safety.note.addNotNullFails=Колонка NOT NULL {0} без DEFAULT не добавится в таблицу, где есть строки.
safety.note.briefLockBigTable=Короткая ACCESS EXCLUSIVE на большой таблице: в очереди за долгими запросами она блокирует всё; ожидание ограничивает lock_timeout.
safety.note.blocksAll=Чтение и запись таблицы заблокированы на всё время выполнения.
safety.note.blocksWrites=Запись в таблицу заблокирована на всё время выполнения.
safety.alt.backfill=заполните новую колонку для существующих строк до VALIDATE (для больших таблиц — пачками), например:
safety.alt.setNotNullUsesCheck=PostgreSQL 12+: SET NOT NULL использует проверенный CHECK и пропускает сканирование таблицы
push.stepFailed=Коммит {0} ({1}): шаг {2} из {3} не выполнился в «{4}»: {5}. Коммиты до него накачены; применённые шаги этого коммита видны там как незакоммиченные изменения.
