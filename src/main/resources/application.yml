spring:
  application:
    name: pg-git-vc
  main:
    banner-mode: off

server:
  # Local developer tool: listen on localhost only (override with --server.address=0.0.0.0).
  address: 127.0.0.1
  port: 8765

pgvc:
  # filled in by Maven resource filtering (spring-boot-starter-parent, @...@ delimiters)
  version: '@project.version@'
  environments-file: ./pgvc-environments.json
  # blank: pgvc-settings.json next to the environments file
  settings-file: ""
  connect-timeout-seconds: 5
  max-pool-size: 4
  # defaults for every executed migration / rollback / push (SET LOCAL ...)
  lock-timeout: 3s
  statement-timeout: 60s

logging:
  level:
    root: WARN
    com.vodianoy: INFO
    org.springframework.boot.web.embedded.tomcat: INFO
