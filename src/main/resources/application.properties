spring.application.name=pg-git-vc
spring.main.banner-mode=off

# Local developer tool: listen on localhost only. Override with --server.address=0.0.0.0 if needed.
server.address=127.0.0.1
server.port=8765
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/plain

# File with database environments (Dev / Test / Stage / Prod), relative to the working directory.
pgvc.environments-file=./pgvc-environments.json
pgvc.connect-timeout-seconds=5

logging.level.root=WARN
logging.level.com.vodianoy=INFO
