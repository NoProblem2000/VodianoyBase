name: release

# Publishes a GitHub Release with the single jar (+ SHA-256) for the version in pom.xml.
#  - push to main: releases v<pom version> if .github/release/v<version>.md exists and that release does not exist yet
#    (so a release is cut by bumping the version in pom.xml and adding its release notes);
#  - push of a tag vX.Y.Z: releases that tag (it must match the pom version);
#  - manual run (workflow_dispatch): same as push to main.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Decide what to release
        id: plan
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          tag="v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom version $version"; exit 1
          fi
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Snapshot version $version: nothing to release"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ ! -f ".github/release/$tag.md" ]; then
            echo "No .github/release/$tag.md: nothing to release"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Releasing $tag"; echo "go=true" >> "$GITHUB_OUTPUT"

      # tests already ran on PostgreSQL 11 and 16 for this commit in the build workflow
      - name: Build jar
        if: steps.plan.outputs.go == 'true'
        run: mvn -B -ntp clean package -DskipTests

      - name: Checksum
        if: steps.plan.outputs.go == 'true'
        working-directory: target
        run: sha256sum "pg-git-vc-$VERSION.jar" > "pg-git-vc-$VERSION.jar.sha256" && cat "pg-git-vc-$VERSION.jar.sha256"

      - name: Publish release
        if: steps.plan.outputs.go == 'true'
        run: |
          notes=".github/release/$TAG.md"
          [ -f "$notes" ] || notes=/dev/null
          # creates the tag on this commit when it does not exist yet
          gh release create "$TAG" \
            "target/pg-git-vc-$VERSION.jar" "target/pg-git-vc-$VERSION.jar.sha256" \
            --target "$GITHUB_SHA" --title "PgGitVisualizer $TAG" --notes-file "$notes"
