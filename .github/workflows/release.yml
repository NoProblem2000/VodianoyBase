name: release

# Push a tag like v1.0.0 -> builds the single jar and publishes a GitHub Release with it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check that the tag matches the pom version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "pom version: $version, tag: $GITHUB_REF_NAME"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match pom version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # tests already ran on PostgreSQL 11 and 16 for this commit in the build workflow
      - name: Build jar
        run: mvn -B -ntp clean package -DskipTests

      - name: Checksum
        working-directory: target
        run: sha256sum "pg-git-vc-$VERSION.jar" > "pg-git-vc-$VERSION.jar.sha256" && cat "pg-git-vc-$VERSION.jar.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" \
            "target/pg-git-vc-$VERSION.jar" "target/pg-git-vc-$VERSION.jar.sha256" \
            --title "PgGitVisualizer $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
