name: build

on:
  push:
    branches-ignore: ['draft/**', 'ci-artifacts']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build & test (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['11', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Type-check frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund 2>&1 | tee ../npm.log
          npm run typecheck 2>&1 | tee ../typecheck.log
          exit ${PIPESTATUS[0]}

      - name: Build jar and run tests
        env:
          PGVC_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
          PGVC_TEST_USER: postgres
          PGVC_TEST_PASSWORD: postgres
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log

      - name: Smoke-test the executable jar
        if: matrix.postgres == '16'
        env:
          PGVC_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
          PGVC_TEST_USER: postgres
          PGVC_TEST_PASSWORD: postgres
        run: .github/scripts/smoke-jar.sh

      - name: UI screenshots (Playwright)
        if: matrix.postgres == '16' && github.event_name == 'push'
        env:
          PGVC_TEST_USER: postgres
          PGVC_TEST_PASSWORD: postgres
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/ui-demo.sh
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.49.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          cp $GITHUB_WORKSPACE/.github/scripts/ui-screenshots.mjs . && node ui-screenshots.mjs /tmp/ui-artifacts/screenshots
          cp "$(cat /tmp/ui-demo-workdir)/app.log" /tmp/ui-artifacts/app.log
          cp $GITHUB_WORKSPACE/frontend/package-lock.json /tmp/ui-artifacts/ 2>/dev/null || true
          cd /tmp/ui-artifacts && git init -q && git checkout -q -b ci-artifacts
          git -c user.name=ci -c user.email=ci@localhost add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "UI screenshots for ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-artifacts

      - name: Report test summary
        if: always()
        run: python3 .github/scripts/test-summary.py "PostgreSQL ${{ matrix.postgres }}"

      - name: Report failures as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh

      - name: Upload pg-git-vc.jar
        if: success() && matrix.postgres == '16'
        uses: actions/upload-artifact@v4
        with:
          name: pg-git-vc
          path: target/pg-git-vc-*.jar
